<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment | City Care Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302d;--muted:#5a6f6c;--teal:#0b7a75;--mist:#eaf3f1;--paper:#fbfcfb;--line:#cfdedb;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6f1ef;--muted:#9bb3af;--teal:#3fc1b8;--mist:#1a2b29;--paper:#0f1a19;--line:#2c4441;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
header{padding:2rem 1.25rem 1rem;max-width:960px;margin:auto}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 .25rem;font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:52ch}
main{max-width:960px;margin:auto;padding:1rem 1.25rem 3rem;display:grid;gap:1.25rem}
section{border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem;background:var(--paper)}
section[hidden]{display:none}
h2{font-size:1.05rem;margin:0 0 .75rem}
.step{color:var(--teal);font-weight:800;margin-right:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
button,input,select,textarea{font:inherit;color:inherit}
.opt{text-align:left;background:var(--mist);border:1px solid transparent;border-radius:8px;padding:.7rem .8rem;cursor:pointer}
.opt small{display:block;color:var(--muted)}
.opt:hover{border-color:var(--teal)}
.opt[aria-pressed=true]{background:var(--teal);color:#fff}
.opt[aria-pressed=true] small{color:#e4f6f4}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.slots{display:flex;flex-wrap:wrap;gap:.5rem}
.slot{padding:.45rem .8rem;border-radius:999px;border:1px solid var(--teal);background:transparent;cursor:pointer;font-weight:600}
.slot[aria-pressed=true]{background:var(--teal);color:#fff}
label{display:block;font-weight:600;margin:.6rem 0 .2rem}
input,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.primary{margin-top:1rem;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:.75rem 1.4rem;font-weight:800;cursor:pointer}
.primary:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:.6rem;font-weight:600}.msg.err{color:var(--bad)}
.empty{color:var(--muted)}
.done{background:var(--mist)}
.done strong{font-size:1.6rem;letter-spacing:.06em}
</style>
</head>
<body>
<header>
  <h1>Book a doctor, pick your time.</h1>
  <p>Choose a department, a doctor and a free slot. You will get a reference code to show at the reception desk.</p>
</header>
<main>
  <section id="s1"><h2><span class="step">1</span>Department</h2><div class="grid" id="depts"></div></section>
  <section id="s2" hidden><h2><span class="step">2</span>Doctor</h2><div class="grid" id="docs"></div></section>
  <section id="s3" hidden>
    <h2><span class="step">3</span>Date and time</h2>
    <label for="date">Date</label><input type="date" id="date" style="max-width:220px">
    <div style="margin-top:.8rem" class="slots" id="slots"></div>
  </section>
  <section id="s4" hidden>
    <h2><span class="step">4</span>Your details</h2>
    <div class="row">
      <div><label for="name">Full name</label><input id="name" autocomplete="name"></div>
      <div><label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel"></div>
    </div>
    <label for="email">Email (optional)</label><input id="email" type="email" autocomplete="email">
    <label for="reason">Reason for visit (optional)</label><textarea id="reason" rows="2"></textarea>
    <button class="primary" id="book">Confirm appointment</button>
    <div class="msg" id="msg" role="status"></div>
  </section>
  <section id="done" class="done" hidden></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { dept: null, doc: null, date: '', time: '' };
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function card(parent, title, sub, onClick) {
  const b = document.createElement('button');
  b.className = 'opt'; b.setAttribute('aria-pressed', 'false');
  b.textContent = title;
  if (sub) { const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  b.onclick = () => { [...parent.children].forEach(c => c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onClick(); };
  parent.appendChild(b);
}

async function loadDepts() {
  const list = await api('/api/departments');
  list.forEach(d => card($('depts'), d.name, d.description, () => pickDept(d)));
}
async function pickDept(d) {
  state.dept = d; state.doc = null; state.time = '';
  ['s3','s4','done'].forEach(i => $(i).hidden = true);
  $('docs').innerHTML = '';
  const docs = await api('/api/doctors?department_id=' + d.id);
  docs.forEach(x => {
    const days = x.work_days.split(',').map(n => DAYS[n]).join(', ');
    card($('docs'), x.name, `${x.title} · ${days}`, () => pickDoc(x));
  });
  $('s2').hidden = false;
}
function pickDoc(x) {
  state.doc = x; state.time = '';
  const today = new Date().toISOString().slice(0, 10);
  $('date').min = today; $('date').value = ''; $('slots').innerHTML = '';
  $('s3').hidden = false; $('s4').hidden = true;
}
$('date').onchange = async (e) => {
  state.date = e.target.value; state.time = ''; $('s4').hidden = true;
  const box = $('slots'); box.innerHTML = '';
  if (!state.date) return;
  const slots = await api(`/api/doctors/${state.doc.id}/slots?date=${state.date}`);
  if (!slots.length) { box.innerHTML = '<span class="empty">No free slots on this date. Try another day.</span>'; return; }
  slots.forEach(t => {
    const b = document.createElement('button');
    b.className = 'slot'; b.textContent = t; b.setAttribute('aria-pressed','false');
    b.onclick = () => { [...box.children].forEach(c => c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); state.time = t; $('s4').hidden = false; };
    box.appendChild(b);
  });
};
$('book').onclick = async () => {
  const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
  $('book').disabled = true;
  try {
    const r = await api('/api/appointments', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctor_id: state.doc.id, date: state.date, time: state.time,
        patient_name: $('name').value, phone: $('phone').value, email: $('email').value, reason: $('reason').value })
    });
    ['s1','s2','s3','s4'].forEach(i => $(i).hidden = true);
    const d = $('done'); d.hidden = false; d.innerHTML = '';
    const h = document.createElement('h2'); h.textContent = 'Your appointment is booked';
    const p = document.createElement('p'); p.textContent = `${state.doc.name}, ${state.date} at ${state.time}. Show this code at reception:`;
    const s = document.createElement('strong'); s.textContent = r.ref_code;
    d.append(h, p, s);
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = e.message;
    if (state.date) $('date').dispatchEvent(new Event('change'));
  } finally { $('book').disabled = false; }
};
loadDepts();
</script>
</body>
</html>
